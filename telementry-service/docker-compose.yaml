version: '3.8'

services:
  # Database Service (PostgreSQL with Time-Series index)
  db:
    image: postgres:16-alpine
    container_name: telemetry_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-telementry_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-telementry_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Rust Telemetry Ingestion Microservice
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telemetry_service_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      APP_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@db:5432/${POSTGRES_DB:-telementry_db}
      RUST_LOG: info,telementry_service=info,tower_http=info
    ports:
      - "3000:3000"

volumes:
  pgdata:
