[package]
name = "telementry-service"
version = "0.1.0"
edition = "2024"

[dependencies]

# Async runtime & framework
tokio = { version = "1.38", features = ["full"] }
Auxum = { version = "0.7", feature = ["marcos"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }

# Serialization & Validation
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# Database with compiletime query verification
sqlx = { version = "0.7", features = ["runtime-native-tokyo-tls", "postgres", "chrono", "uuid", "migrate"] }
uuid = { version = "1.8", features = ["serde", "v4"] }

# Error handling and observability
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenv = "0.15"

[dev-dependencies]
reqwest = { version = "0.12", features = "json" }
